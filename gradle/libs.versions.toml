[versions]
jda = "6.4.2"
dotenv = "3.2.0"
slf4j = "2.1.0-alpha1"
logback = "1.5.18"
gson = "2.14.0"
caffeine = "3.2.0"
guice = "7.0.0"
sqlite = "3.49.1.0"
hikari = "6.3.0"
okhttp = "5.4.0"
jsoup = "1.19.1"
junit = "5.12.1"
mockito = "5.15.2"
junitLauncher = "1.12.1"

[libraries]
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
dotenv = { module = "io.github.cdimascio:dotenv-java", version.ref = "dotenv" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
guice = { module = "com.google.inject:guice", version.ref = "guice" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitLauncher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

[plugins]
spotbugs = { id = "com.github.spotbugs", version = "6.1.7" }
