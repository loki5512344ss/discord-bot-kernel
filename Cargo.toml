[package]
name = "bot-kernel"
version = "0.1.0"
edition = "2024"
description = "Loki Blog Discord Bot — Rust kernel (serenity 0.12.5 + poise 0.7.0), edition 2024"
authors = ["loki"]
license = "MIT"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
poise = "0.7.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serenity = { version = "0.12.5", features = ["gateway", "cache", "client", "model", "rustls_backend", "utils"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
unreachable_pub = "allow"

[lints.clippy]
pedantic = "allow"
nursery = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
